[project]
name = "micropick"
version = "0.1.0"
description = "Control software for an OT-2 extended for microtissue handling"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "pydantic>=2.5",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
hardware = [
    "keyboard",
    "pygrabber; sys_platform == 'win32'",
]
ml = ["ultralytics"]
dev = ["nbstripout", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micropick", "src/opentrons_api"]