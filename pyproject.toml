[project]
name = "micropick"
version = "0.1.0"
description = "Control software for an OT-2 extended for microtissue handling"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "pydantic>=2.5",
    "requests>=2.31",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

[project.optional-dependencies]
hardware = [
    "keyboard",
    "pygrabber; sys_platform == 'win32'",
]
ml = ["ultralytics"]
# The desktop application. Deliberately free of `ml`: the GUI is developed
# against mocks, and a machine that only drives the robot by hand should not
# be made to install a training stack to do it.
gui = ["PySide6>=6.7", "pyqtdarktheme-fork", "pyqtgraph", "qtawesome"]
# Stock Opentrons labware definitions. Optional: custom plates in labware/ need
# nothing. It pins numpy~=1.26, which conflicts with the numpy>=2 the vision
# stack needs; install with pip's warning (runtime works with numpy 2), or keep
# your plates in labware/.
stock = ["opentrons-shared-data"]
dev = ["nbstripout", "pytest", "ruff"]

[project.scripts]
micropick-gui = "micropick.gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micropick", "src/opentrons_api"]