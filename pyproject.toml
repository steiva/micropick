[project]
name = "micropick"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "scipy>=1.11",
    "pydantic>=2.5",
]

[project.optional-dependencies]
hardware = ["pygrabber; sys_platform == 'win32'", "keyboard"]
ml = ["ultralytics"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuboidlab"]

dependencies = [
    "opentrons-http-wrapper @ git+https://github.com/steiva/opentrons-ot2-http-python-wrapper.git@7cd1b88fe235dea57be535619d2d7fa25b23ab7b",
]