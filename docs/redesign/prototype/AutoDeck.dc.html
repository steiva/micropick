<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>micropick: Auto pick, deck</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1114}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
.app{width:100%;height:900px;background:#0F1114;color:#E8EAED;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{height:64px;flex:none;display:flex;align-items:center;gap:6px;padding:0 16px;background:#14171B;border-bottom:1px solid #22262C}
.ibtn{min-width:44px;height:44px;padding:0 14px;box-sizing:border-box;border-radius:10px;border:none;background:transparent;color:#C9CED6;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;font:500 14px 'Inter',sans-serif}
.ibtn:hover{background:#1E2228;color:#E8EAED}
.crumb{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 10px;border-radius:10px;color:#B3B9C2;font:600 15px 'Inter',sans-serif;text-decoration:none}
a.crumb:hover{background:#1E2228;color:#E8EAED}
.cap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8A919B;font-weight:600}
.btn{height:44px;padding:0 20px;box-sizing:border-box;border-radius:10px;font:600 15px 'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;border:1px solid #2E333B;background:transparent;color:#E8EAED}
.btn:hover{background:#1E2228;color:#E8EAED}
.btn-p{background:#6CA6FF;border-color:#6CA6FF;color:#0B1220}
.btn-p:hover{background:#8DB8FF;color:#0B1220}
.steps{height:56px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid #22262C;background:#111317}
.st{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:10px;text-decoration:none;color:#B3B9C2;font-size:15px;font-weight:500}
.st:hover{background:#1A1D22;color:#E8EAED}
.num{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-sizing:border-box}
.line{width:28px;height:1px;background:#2E333B}
.tile{position:relative;border-radius:14px;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font-family:inherit;color:#E8EAED;min-height:0}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid #2E333B;background:transparent;color:#C9CED6;font:500 14px 'Inter',sans-serif;cursor:pointer}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;box-sizing:border-box;border-radius:10px;border:none;background:transparent;color:#E8EAED;text-align:left;font-family:inherit;cursor:pointer}
.item:hover{background:#1E2228}
input.field{height:44px;box-sizing:border-box;border-radius:10px;border:1px solid #2E333B;background:#0F1114;color:#E8EAED;padding:0 14px 0 40px;font:500 15px 'Inter',sans-serif;width:100%}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;background:#16261E;color:#3DD68C;font-weight:600;font-size:15px;border:1px solid #1F3A2B;z-index:5}
</style>
</helmet>
<div class="app">
  <!-- Top bar, as on Home: back = previous step, then the path -->
  <header class="top">
    <a class="crumb" href="Main.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Home</a>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    <span class="crumb" aria-current="page" style="color:#E8EAED">Auto pick</span>
    <div style="flex:1"></div>
    <button class="ibtn" type="button" style="background:#E8EAED; color:#0F1114; font-weight:700"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"></path></svg>Light</button>
    <button class="ibtn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Lock</button>
    <button class="ibtn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 16l8-8"></path><path d="M11 8h5v5"></path></svg>Park</button>
    <span style="width:1px; height:28px; background:#2A2E35; margin:0 6px"></span>
    <button class="ibtn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>Settings</button>
  </header>

  <nav class="steps" aria-label="Steps">
    <a class="st" href="AutoDeck.dc.html" style="background:#1A2130; color:#E8EAED"><span class="num" style="background:#6CA6FF; color:#0B1220">1</span>Deck</a>
    <span class="line"></span>
    <a class="st" href="AutoTip.dc.html"><span class="num" style="border:1.5px solid #4A515B; color:#B3B9C2">2</span>Tip</a>
    <span class="line"></span>
    <a class="st" href="AutoPlan.dc.html"><span class="num" style="border:1.5px solid #4A515B; color:#B3B9C2">3</span>Plan</a>
    <span class="line"></span>
    <a class="st" href="AutoBottom.dc.html"><span class="num" style="border:1.5px solid #4A515B; color:#B3B9C2">4</span>Dish bottom</a>
    <span class="line"></span>
    <a class="st" href="AutoPicking.dc.html"><span class="num" style="border:1.5px solid #4A515B; color:#B3B9C2">5</span>Picking</a>
  </nav>

  <div style="flex:1; display:flex; min-height:0">
    <section style="flex:1; min-width:0; padding:20px 28px; box-sizing:border-box; display:flex; flex-direction:column; gap:14px">
      <sc-if value="{{showMemo}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:12px; background:#17233A; color:#C9DCFF; font-size:14px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
          <div style="flex:1">The robot remembers what was on it last time. Check that it matches the real deck.</div>
          <button type="button" onClick="{{hideMemo}}" style="border:none; background:transparent; color:#C9DCFF; font:600 14px 'Inter',sans-serif; cursor:pointer; height:32px">Got it</button>
        </div>
      </sc-if>
      <div style="flex:1; min-height:0; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); grid-template-rows:repeat(4, minmax(0, 1fr)); gap:12px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
          <button class="tile" type="button" onClick="{{t.pick}}" style="background:{{t.bg}}; border:{{t.border}}">
            <div style="display:flex; align-items:center; gap:8px; width:100%">
              <span style="font-size:12px; font-weight:700; letter-spacing:.09em; color:#8A919B">SLOT {{t.n}}</span>
              <sc-if value="{{t.fromSetup}}" hint-placeholder-val="{{ false }}">
                <span style="font-size:11px; font-weight:600; color:#B3B9C2; border:1px solid #3A4049; border-radius:999px; padding:2px 8px">{{t.platform}}</span>
              </sc-if>
            </div>
            <sc-if value="{{t.isTrash}}" hint-placeholder-val="{{ false }}">
              <span style="font-size:26px; font-weight:700; letter-spacing:.18em; color:#4A515B; align-self:center; margin-bottom:10px">TRASH</span>
            </sc-if>
            <sc-if value="{{t.filled}}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; align-items:center; gap:10px">
                <span style="width:34px; height:34px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background:{{t.iconBg}}; color:{{t.color}}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
                </span>
                <span style="display:flex; flex-direction:column; gap:2px; min-width:0">
                  <span style="font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{t.name}}</span>
                  <span style="font-size:13px; color:#B3B9C2">{{t.meta}}</span>
                </span>
              </div>
            </sc-if>
            <sc-if value="{{t.empty}}" hint-placeholder-val="{{ true }}">
              <span style="font-size:14px; color:#6F7781">Empty</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <div style="font-size:13px; color:#8A919B">Drag an item to another slot to move it.</div>
    </section>

    <aside style="width:400px; flex:none; padding:24px; box-sizing:border-box; border-left:1px solid #22262C; display:flex; flex-direction:column; gap:16px; overflow:auto">
      <h1 style="margin:0; font-size:22px; font-weight:600">{{panelTitle}}</h1>

      <sc-if value="{{selFilled}}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:14px">
          <div style="display:flex; align-items:center; gap:12px; padding:14px; border-radius:12px; background:#171A1F; border:1px solid #23272E">
            <span style="width:40px; height:40px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; background:{{selIconBg}}; color:{{selColor}}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{selIcon}}"></path></svg>
            </span>
            <span style="display:flex; flex-direction:column; gap:2px">
              <span style="font-size:15px; font-weight:600">{{selName}}</span>
              <span style="font-size:13px; color:#B3B9C2">{{selMeta}}</span>
            </span>
          </div>
          <div style="display:flex; gap:10px">
            <button class="btn" type="button" onClick="{{removeSel}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Remove
            </button>
            <button class="btn" type="button" onClick="{{replaceSel}}">Put something else</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{selEmpty}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; flex-direction:column; gap:14px">
          <div style="position:relative">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A919B" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute; left:13px; top:13px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <label for="lw" style="position:absolute; width:1px; height:1px; overflow:hidden">Search labware</label>
            <input class="field" id="lw" type="search" placeholder="Search, e.g. 384">
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
              <button class="chip" type="button" onClick="{{c.pick}}" style="background:{{c.bg}}; color:{{c.fg}}; border-color:{{c.bd}}">{{c.label}}</button>
            </sc-for>
          </div>
          <div style="display:flex; flex-direction:column">
            <sc-for list="{{lib}}" as="l" hint-placeholder-count="5">
              <button class="item" type="button" onClick="{{l.put}}">
                <span style="width:36px; height:36px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background:{{l.iconBg}}; color:{{l.color}}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.icon}}"></path></svg>
                </span>
                <span style="flex:1; display:flex; flex-direction:column; gap:2px">
                  <span style="font-size:15px; font-weight:600">{{l.name}}</span>
                  <span style="font-size:13px; color:#B3B9C2">{{l.meta}}</span>
                </span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A919B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <div style="margin-top:auto; padding-top:16px; border-top:1px solid #22262C">
        <a class="btn" href="Profile.dc.html" style="width:100%">Change platforms in Robot setup</a>
      </div>
    </aside>
  </div>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div class="toast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>{{toast}}</div>
  </sc-if>

  <footer style="height:72px; flex:none; display:flex; align-items:center; justify-content:flex-end; gap:12px; padding:0 20px; border-top:1px solid #22262C; background:#14171B">
    <a class="btn btn-p" href="AutoTip.dc.html">Next
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sel: '7', chip: 'Frequent', memo: true, flash: '',
      deck: { '10': 'tips', '12': 'trash', '8': 'dish', '9': 'cal', '5': 'p384' }
    };
  }
  renderVals() {
    const ICON = {
      plate: 'M3 6h18v12H3z M7 10h.01 M11 10h.01 M15 10h.01 M7 14h.01 M11 14h.01 M15 14h.01',
      tips: 'M9 3h6v4l-2 14h-2L9 7z M9 7h6',
      dish: 'M3 12a9 4 0 1 0 18 0a9 4 0 1 0 -18 0 M3 12v2a9 4 0 0 0 18 0v-2',
      cal: 'M12 3v18 M3 12h18 M12 12m-5 0a5 5 0 1 0 10 0a5 5 0 1 0 -10 0'
    };
    const KIND = {
      plate: { color: '#A99BFA', iconBg: '#221E35' },
      tips: { color: '#4FC9B8', iconBg: '#15282A' },
      dish: { color: '#EE93BE', iconBg: '#2C1A24' },
      cal: { color: '#C9CED6', iconBg: '#22262C' }
    };
    const LIB = {
      p384: { kind: 'plate', name: 'Corning 384 well plate', meta: '384 wells · 112 µl · flat' },
      p384s: { kind: 'plate', name: 'Corning 384 well plate', meta: '384 wells · 40 µl · small volume' },
      p96: { kind: 'plate', name: 'Corning 96 well plate', meta: '96 wells · 360 µl · flat' },
      p24: { kind: 'plate', name: 'Corning 24 well plate', meta: '24 wells · 3.4 ml' },
      tips: { kind: 'tips', name: 'VWR tips, 200 µl', meta: '96 tips' },
      dish: { kind: 'dish', name: 'Petri dish with cuboids', meta: '35 mm' },
      cal: { kind: 'cal', name: 'Crosshair disc', meta: 'For tip calibration' }
    };
    const PLATFORM = { '5': 'Picking platform', '8': 'Picking platform', '9': 'Calibration module' };
    const order = ['10', '11', '12', '7', '8', '9', '4', '5', '6', '1', '2', '3'];
    const deck = this.state.deck;
    const sel = this.state.sel;
    const tiles = order.map((n) => {
      const key = deck[n];
      const trash = key === 'trash';
      const lw = key && !trash ? LIB[key] : null;
      const k = lw ? KIND[lw.kind] : null;
      const isSel = n === sel;
      return {
        n: n, filled: !!lw, empty: !key, isTrash: trash,
        name: lw ? lw.name : '', meta: lw ? lw.meta : '',
        icon: lw ? ICON[lw.kind] : '', color: k ? k.color : '', iconBg: k ? k.iconBg : '',
        fromSetup: !!PLATFORM[n], platform: PLATFORM[n] || '',
        bg: trash ? 'repeating-linear-gradient(45deg,#14171B 0 8px,#111317 8px 16px)' : (isSel ? '#1A2130' : (lw ? '#171A1F' : '#131519')),
        border: trash ? '1px solid transparent' : (isSel ? '2px solid #6CA6FF' : (PLATFORM[n] ? '1px dashed #3A4049' : '1px solid #22262C')),
        pick: () => { if (!trash) this.setState({ sel: n, flash: '' }); }
      };
    });
    const chipDefs = { Frequent: ['p384', 'p96', 'tips', 'dish'], Plates: ['p384', 'p384s', 'p96', 'p24'], Tips: ['tips'], Dishes: ['dish'] };
    const chips = Object.keys(chipDefs).map((c) => {
      const on = this.state.chip === c;
      return { label: c, bg: on ? '#E8EAED' : 'transparent', fg: on ? '#0F1114' : '#C9CED6', bd: on ? '#E8EAED' : '#2E333B', pick: () => this.setState({ chip: c }) };
    });
    const lib = chipDefs[this.state.chip].map((key) => {
      const lw = LIB[key]; const k = KIND[lw.kind];
      return {
        name: lw.name, meta: lw.meta, icon: ICON[lw.kind], color: k.color, iconBg: k.iconBg,
        put: () => { const d = Object.assign({}, deck); d[sel] = key; this.setState({ deck: d, flash: lw.name + ' is in slot ' + sel + '.' }); }
      };
    });
    const selKey = deck[sel];
    const selLw = selKey ? LIB[selKey] : null;
    const selK = selLw ? KIND[selLw.kind] : null;
    return {
      tiles: tiles, chips: chips, lib: lib,
      selFilled: !!selLw, selEmpty: !selLw,
      panelTitle: selLw ? 'In slot ' + sel : 'What goes to slot ' + sel + '?',
      selName: selLw ? selLw.name : '', selMeta: selLw ? selLw.meta : '',
      selIcon: selLw ? ICON[selLw.kind] : '', selColor: selK ? selK.color : '', selIconBg: selK ? selK.iconBg : '',
      removeSel: () => { const d = Object.assign({}, deck); delete d[sel]; this.setState({ deck: d, flash: 'Slot ' + sel + ' is empty.' }); },
      replaceSel: () => { const d = Object.assign({}, deck); delete d[sel]; this.setState({ deck: d, flash: '' }); },
      hasToast: !!this.state.flash, toast: this.state.flash,
      showMemo: this.state.memo, hideMemo: () => this.setState({ memo: false })
    };
  }
}
</script>
</body>
</html>
